name: CI
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_call:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Test editor
        run: node --test tests/js/code-editor.test.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: modeler:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test the packaged runtime
        run: |
          set -euo pipefail
          trap 'docker rm -f modeler-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name modeler-ci -p 127.0.0.1:8088:8088 modeler:ci
          mkdir -p pilot-jars
          docker cp modeler-ci:/opt/pilot/. pilot-jars/
          docker cp modeler-ci:/opt/sysml.library "$RUNNER_TEMP/"
          export SYSML_LIBRARY_PATH="$RUNNER_TEMP/sysml.library"
          sudo apt-get update
          sudo apt-get install -y graphviz
          python3 -m unittest discover -s tests -v
          curl --fail --silent --show-error --retry 20 --retry-connrefused http://localhost:8088/health
          python3 tests/http/render_formats.py
