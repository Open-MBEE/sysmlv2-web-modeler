name: Qualify published image
on:
  workflow_dispatch:
    inputs:
      digest:
        description: GHCR image digest from the GitHub Release
        required: true
permissions:
  contents: read
  packages: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: starforge-qualification
    env:
      SYSML_API_BASE: https://experimental.starforge.app/
      SYSML_API_TOKEN: ${{ secrets.SYSML_API_TOKEN }}
      SYSML_TEST_PROJECT_ID: ${{ vars.SYSML_TEST_PROJECT_ID }}
      SYSML_TEST_BRANCH_ID: ${{ vars.SYSML_TEST_BRANCH_ID }}
      DIGEST: ${{ inputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check both deployment modes
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          : "${SYSML_TEST_PROJECT_ID:?Set the qualification project ID}"
          : "${SYSML_TEST_BRANCH_ID:?Set the qualification branch ID}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}@$DIGEST"
          docker pull "$image"
          trap 'docker rm -f modeler-candidate >/dev/null 2>&1 || true' EXIT
          for mode in standalone embedded; do
            docker run -d --name modeler-candidate -p 127.0.0.1:8088:8088 \
              -e SYSML_API_BASE -e SYSML_API_TOKEN -e "SYSML_UI_MODE=$mode" "$image"
            if ! curl --fail --silent --show-error --retry 30 --retry-all-errors \
              --retry-delay 1 --max-time 2 --retry-max-time 45 http://localhost:8088/health; then
              docker logs modeler-candidate
              exit 1
            fi
            python3 tests/http/qualify.py "$mode"
            python3 tests/http/render_formats.py
            docker rm -f modeler-candidate
          done
